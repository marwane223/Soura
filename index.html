  <meta name="twitter:description" content="استمع إلى سور من القرآن الكريم.">

  <!-- Favicon -->
  <link rel="icon" href="assets/img/favicon.png" type="image/png">

  <!-- Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>سور من القرآن الكريم</h1>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="التحويل إلى الوضع الليلي" aria-pressed="false">
      <i class="fas fa-moon" aria-hidden="true"></i>
    </button>
  </header>

  <main class="content">
    <section class="player-card" aria-label="مشغل القرآن الكريم">
      <div class="reciter-controls">
        <label for="reciterSearch">اختر القارئ</label>
        <input id="reciterSearch" type="search" placeholder="ابحث عن القارئ..." aria-label="ابحث عن القارئ" aria-describedby="reciterSearchStatus" autocomplete="off" disabled>
        <p id="reciterSearchStatus" class="search-status" role="status" aria-live="polite"></p>
        <select id="reciterSelect" aria-label="قائمة القراء" disabled>
          <option value="">جارٍ تحميل القراء...</option>
        </select>
      </div>

      <div class="player-info">
        <p id="dailySourasTitle" class="daily-title" aria-live="polite" data-loading="true">جارٍ تحميل قائمة القراء...</p>
        <h2 id="souraTitle" aria-live="polite">اختر قارئاً لبدء الاستماع</h2>
      </div>

      <div class="playback-controls">
        <button id="playPauseButton" type="button" aria-label="تشغيل التلاوة" disabled>
          <i class="fas fa-play" aria-hidden="true"></i>
        </button>
        <div class="progress-wrap">
          <input id="progressBar" type="range" min="0" max="0" value="0" step="0.1" aria-label="التقدم في التلاوة" disabled>
          <div class="progress-times" aria-live="off">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>
      </div>
      <audio id="audioPlayer" preload="metadata"></audio>
    </section>
  </main>

  <footer>
    <p class="footer-heart">
      تطوير مبني على المشروع الأصلي للمطور
      <a href="https://x.com/emadadeldev" target="_blank" rel="noopener noreferrer">Emad Adel</a> – صدقة جارية
    </p>
    <p>
      <a href="https://github.com/marwane223/Soura" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i> رابط المشروع</a>
    </p>
  </footer>

  <script src="assets/js/player.js"></script>

</body>
</html>
